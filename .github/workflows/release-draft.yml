name: Draft Windows release

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  build:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/') && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/windows-build.yml
    with:
      ref: ${{ github.event.pull_request.merge_commit_sha }}
      base-sha: ${{ github.event.pull_request.base.sha }}
      artifact-name: windows-release-${{ github.run_id }}
  sources:
    needs: build
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-release-${{ github.run_id }}
          path: artifacts/source-input
      - name: Verify fixed source links and collect index and notices
        shell: pwsh
        run: |
          $manifest = @(Get-ChildItem artifacts/source-input -Recurse -Filter release.json)
          if ($manifest.Count -ne 1) { throw 'Expected one portable manifest' }
          ./tool/release/package_windows_sources.ps1 -ReleaseDirectory $manifest[0].DirectoryName -OutputDirectory artifacts/source-delivery
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-sources-${{ github.run_id }}
          path: artifacts/source-delivery/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
  draft:
    needs: [build, sources]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-release-${{ github.run_id }}
          path: release-artifact
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-sources-${{ github.run_id }}
          path: release-artifact/sources
      - name: Create or update draft for this commit
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            await require('./.github/scripts/release-draft.cjs').createDraft({github, context, core});
