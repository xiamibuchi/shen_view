name: Pull request checks

on:
  pull_request:
    branches: [main, 'release/**']
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan checks
    runs-on: ubuntu-latest
    outputs:
      windows_required: ${{ steps.plan.outputs.windows_required }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: node --test .github/scripts/*.test.cjs
      - run: node .github/scripts/pr-policy.cjs
      - id: plan
        run: node .github/scripts/ci-plan.cjs
  commits:
    name: Commit message format (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test commit validator and hooks
        shell: bash
        run: sh tool/check/commit_message_test.sh
      - name: Check PR commits
        shell: bash
        env:
          COMMIT_EVENT_NAME: pull_request
          COMMIT_PR_BASE: ${{ github.event.pull_request.base.sha }}
          COMMIT_PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: sh tool/check/commit_message.sh --event
  windows:
    needs: plan
    if: needs.plan.outputs.windows_required == 'true'
    uses: ./.github/workflows/windows-build.yml
    with:
      ref: ${{ github.ref }}
      base-sha: ${{ github.event.pull_request.base.sha }}
      artifact-name: windows-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}
  gate:
    name: PR checks
    if: always()
    needs: [plan, commits, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require all checks
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node .github/scripts/pr-gate.cjs
