name: Warm native dependencies

on:
  workflow_dispatch:
  push:
    branches: [main, 'release/**']
    paths:
      - 'native/**'
      - 'third_party/**'
      - 'tool/build/**'
      - 'tool/paths.ps1'
      - 'tool/toolchain.ps1'
      - 'tool/ci/native-cache.ps1'
      - '.github/workflows/native-cache.yml'
      - '.github/workflows/native-build.yml'

permissions:
  contents: read

concurrency:
  group: native-cache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    uses: ./.github/workflows/native-build.yml
    with:
      ref: ${{ github.sha }}
      artifact-prefix: native-warm-${{ github.run_id }}
      upload-artifacts: false
