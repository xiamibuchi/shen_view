name: Native Windows dependencies

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      artifact-prefix:
        type: string
        required: true
      upload-artifacts:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  native:
    name: Native dependencies (${{ matrix.component }})
    runs-on: windows-2025
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        component: [hdr, ffmpeg]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        if: matrix.component == 'ffmpeg'
        id: msys
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc
      - name: Set compiler path
        if: matrix.component == 'ffmpeg'
        env:
          MSYS_LOCATION: ${{ steps.msys.outputs.msys2-location }}
        run: Add-Content $env:GITHUB_PATH (Join-Path $env:MSYS_LOCATION 'mingw64/bin')
      - name: Identify native build inputs
        id: native-keys
        run: ./tool/ci/native-cache.ps1 -Action Keys -Component '${{ matrix.component }}'
      - name: Restore HDR helpers
        if: matrix.component == 'hdr'
        id: hdr-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          key: ${{ steps.native-keys.outputs.hdr }}
          path: |
            build/hdr-codecs/bin
            build/hdr-codecs/licenses
            build/hdr-codecs/cache-manifest.json
      - name: Restore FFmpeg runtime and SDK
        if: matrix.component == 'ffmpeg'
        id: ffmpeg-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          key: ${{ steps.native-keys.outputs.ffmpeg }}
          path: |
            build/ffmpeg/windows-x64/runtime
            build/ffmpeg/windows-x64/install/include
            build/ffmpeg/windows-x64/install/lib
            build/ffmpeg/windows-x64/install/bin
            build/ffmpeg/windows-x64/sysroot/mingw64/include
            build/ffmpeg/windows-x64/sysroot/mingw64/lib
            build/ffmpeg/windows-x64/cache-manifest.json
      - name: Build and verify native component
        env:
          NATIVE_COMPONENT: ${{ matrix.component }}
        run: |
          $log = Join-Path $env:GITHUB_WORKSPACE 'artifacts/ci'
          New-Item -ItemType Directory -Force $log | Out-Null
          . ./tool/ci/timing.ps1
          $CiTimingPath = Join-Path $log 'native-timings.jsonl'
          Measure-CiStage "Native $env:NATIVE_COMPONENT" {
            & ./tool/ci/native-cache.ps1 -Action Build -Component $env:NATIVE_COMPONENT *>&1 | Tee-Object -FilePath (Join-Path $log 'build.log')
            & ./tool/ci/native-cache.ps1 -Action Verify -Component $env:NATIVE_COMPONENT
          }
      - name: Save verified HDR helpers
        if: matrix.component == 'hdr' && steps.hdr-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          key: ${{ steps.native-keys.outputs.hdr }}
          path: |
            build/hdr-codecs/bin
            build/hdr-codecs/licenses
            build/hdr-codecs/cache-manifest.json
      - name: Save verified FFmpeg runtime and SDK
        if: matrix.component == 'ffmpeg' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          key: ${{ steps.native-keys.outputs.ffmpeg }}
          path: |
            build/ffmpeg/windows-x64/runtime
            build/ffmpeg/windows-x64/install/include
            build/ffmpeg/windows-x64/install/lib
            build/ffmpeg/windows-x64/install/bin
            build/ffmpeg/windows-x64/sysroot/mingw64/include
            build/ffmpeg/windows-x64/sysroot/mingw64/lib
            build/ffmpeg/windows-x64/cache-manifest.json
      - name: Upload HDR helpers
        if: inputs.upload-artifacts && matrix.component == 'hdr'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.artifact-prefix }}-hdr
          path: |
            build/hdr-codecs/bin
            build/hdr-codecs/licenses
            build/hdr-codecs/cache-manifest.json
          if-no-files-found: error
          overwrite: true
          retention-days: 1
      - name: Upload FFmpeg runtime and SDK
        if: inputs.upload-artifacts && matrix.component == 'ffmpeg'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.artifact-prefix }}-ffmpeg
          path: |
            build/ffmpeg/windows-x64/runtime
            build/ffmpeg/windows-x64/install/include
            build/ffmpeg/windows-x64/install/lib
            build/ffmpeg/windows-x64/install/bin
            build/ffmpeg/windows-x64/sysroot/mingw64/include
            build/ffmpeg/windows-x64/sysroot/mingw64/lib
            build/ffmpeg/windows-x64/cache-manifest.json
          if-no-files-found: error
          overwrite: true
          retention-days: 1
      - name: Upload native diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.artifact-prefix }}-${{ matrix.component }}-diagnostics
          path: artifacts/ci
          if-no-files-found: warn
          overwrite: true
          retention-days: 14
